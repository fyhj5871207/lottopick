name: 更新開獎資料並發佈網頁

on:
  schedule:
    - cron: "30 13 * * 1-5"
    - cron: "30 15 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 抓最新開獎
        run: node scripts/update.mjs
      - name: 存回 GitHub
        run: |
          git config user.name "lottopick-bot"
          git config user.email "lottopick-bot@users.noreply.github.com"
          git add site/data.json
          git commit -m "更新開獎資料 $(date -u +%Y-%m-%d)" || echo "沒有變更"
          git push || echo "沒有需要推送的變更"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
